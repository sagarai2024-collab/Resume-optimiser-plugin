# Optional UI metadata for OpenAI hosts. Not required for the skill's behaviour.
# Lives in hosts/ rather than agents/: in Claude plugin format, agents/ means subagents.
author: "Sagarika Chakraborty"
skills:
  - name: resume-optimiser
    interface:
      display_name: "Resume optimiser"
      short_description: "Audit and rewrite resumes, LinkedIn profiles and READMEs"
      default_prompt: "Use $resume-optimiser to audit this resume and tell me what is wrong before rewriting anything."
    policy:
      allow_implicit_invocation: true
